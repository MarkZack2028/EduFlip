services:
  web:
    build: . # ⬅ pakai Dockerfile di folder ini
    container_name: eduflip-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: eduflip-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: eduflip2025
      MYSQL_DATABASE: eduflipdb
      MYSQL_USER: eduflip
      MYSQL_PASSWORD: eduflip2025
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
